# Konfigurasi untuk container halaman ini.
#
# Halaman dilayani di bawah xixlabs.net/upscaler. Server pengarah di landing
# pusat melepas prefix itu sebelum meneruskan permintaan ke sini, sehingga
# container ini menerima path tanpa prefix. Aset hasil build tetap memakai
# alamat /upscaler/assets/... di sisi pengunjung, dan itu sudah sejalan
# karena prefix dilepas di sisi pengarah.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Aset hasil build memakai nama berisi hash, sehingga aman disimpan lama.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Aset lain seperti favicon tidak memakai hash, jadi tidak boleh disimpan
    # selama aset berhash.
    location ~* \.(?:css|js|json|ico|png|svg|webp|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

