# Contoh blok yang ditambahkan ke konfigurasi nginx landing pusat
# (XIXLabs.net/deploy/nginx.conf) untuk melayani halaman desktop.
#
# Ganti vectorizer dan alamat sslip.io dengan milik aplikasi baru.
#
# Catatan penting: upstream memakai alamat sslip.io milik aplikasi, bukan nama
# domain publik. Cloudflare dapat mengarahkan upstream kembali ke landing pusat
# bila permintaan memakai Host publik, dan pola ini menghindarinya. Pola yang
# sama sudah dipakai blok /animotion/.

    location = /vectorizer {
        return 301 https://xixlabs.net/vectorizer/;
    }

    location ^~ /vectorizer/ {
        proxy_set_header Host <uuid-aplikasi>.<ip-server>.sslip.io;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /vectorizer;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://<uuid-aplikasi>.<ip-server>.sslip.io/;
    }

